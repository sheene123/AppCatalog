name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build ACR + déploiement AKS
    runs-on: ubuntu-latest
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' ||
           github.event.workflow_run.conclusion == 'success')
          && vars.AZURE_CLIENT_ID != '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Connexion à Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Build des deux images (API et frontend) directement dans ACR.
      - name: Build & push image API
        run: |
          az acr build --registry "${{ vars.ACR_NAME }}" \
            --image "appcatalog-api:${{ github.sha }}" \
            --image "appcatalog-api:latest" \
            --file Dockerfile .

      - name: Build & push image Web
        run: |
          az acr build --registry "${{ vars.ACR_NAME }}" \
            --image "appcatalog-web:${{ github.sha }}" \
            --image "appcatalog-web:latest" \
            --file Dockerfile.web .

      - name: Configurer kubectl sur AKS
        run: |
          az aks get-credentials \
            --resource-group "${{ vars.AKS_RESOURCE_GROUP }}" \
            --name "${{ vars.AKS_CLUSTER_NAME }}" \
            --admin --overwrite-existing

      # SecretProviderClass : on injecte les valeurs Key Vault (envsubst) puis on applique.
      # Le namespace doit exister d'abord.
      - name: Appliquer la SecretProviderClass (Key Vault)
        env:
          KEYVAULT_NAME: ${{ vars.KEYVAULT_NAME }}
          KV_IDENTITY_CLIENT_ID: ${{ vars.KV_IDENTITY_CLIENT_ID }}
          TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        run: |
          kubectl apply -f k8s/namespace.yaml
          envsubst < k8s/secretproviderclass.yaml | kubectl apply -n appcatalog -f -

      - name: Déployer sur AKS
        run: |
          kubectl apply -k k8s/
          kubectl set image deployment/appcatalog-api \
            api="${{ vars.ACR_LOGIN_SERVER }}/appcatalog-api:${{ github.sha }}" -n appcatalog
          kubectl set image deployment/appcatalog-web \
            web="${{ vars.ACR_LOGIN_SERVER }}/appcatalog-web:${{ github.sha }}" -n appcatalog
          kubectl rollout status statefulset/neo4j -n appcatalog --timeout=240s
          kubectl rollout status deployment/appcatalog-api -n appcatalog --timeout=180s
          kubectl rollout status deployment/appcatalog-web -n appcatalog --timeout=180s

      - name: Afficher l'URL publique du frontend
        run: |
          echo "IP publique du frontend :"
          kubectl get service appcatalog-web -n appcatalog \
            -o jsonpath='{.status.loadBalancer.ingress[0].ip}'
          echo ""
