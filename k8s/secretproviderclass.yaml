# Relie un secret Azure Key Vault à Kubernetes via le Secret Store CSI Driver.
# Les placeholders ${...} sont substitués au déploiement (envsubst) à partir des
# sorties Terraform. Le mot de passe Neo4j ne quitte jamais Key Vault en clair dans Git.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: appcatalog-neo4j
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: "${KV_IDENTITY_CLIENT_ID}" # identité du CSI (addon AKS)
    keyvaultName: "${KEYVAULT_NAME}"
    tenantId: "${TENANT_ID}"
    objects: |
      array:
        - |
          objectName: neo4j-password
          objectType: secret
  # Synchronise le secret Key Vault vers un Secret Kubernetes natif « neo4j-auth »,
  # consommé par les pods via secretKeyRef. La synchro a lieu au montage du volume CSI,
  # donc avant le démarrage des conteneurs -> pas de course.
  secretObjects:
    - secretName: neo4j-auth
      type: Opaque
      data:
        - objectName: neo4j-password
          key: password
