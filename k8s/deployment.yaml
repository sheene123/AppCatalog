apiVersion: apps/v1
kind: Deployment
metadata:
  name: appcatalog
  labels:
    app: appcatalog
spec:
  # 1 réplica : la base SQLite est locale au pod. Passer à N réplicas donnerait
  # N bases distinctes et des réponses incohérentes. Scaler horizontalement suppose
  # d'externaliser l'état (PostgreSQL) — voir README. Le HPA ci-joint illustre la
  # mécanique, mais l'état doit être partagé avant de dépasser 1.
  replicas: 1
  selector:
    matchLabels:
      app: appcatalog
  template:
    metadata:
      labels:
        app: appcatalog
    spec:
      # Durcissement au niveau du pod : exécution sans privilège root.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000 # rend les volumes montés accessibles à l'utilisateur 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: appcatalog:latest # remplacé par l'image ACR + tag en CD (kustomize)
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ASPNETCORE_HTTP_PORTS
              value: "8080"
            # La base SQLite est écrite sur un volume dédié, pas dans /app
            # (système de fichiers en lecture seule, voir plus bas).
            - name: ConnectionStrings__AppCatalog
              value: "Data Source=/data/appcatalog.db"
          # Durcissement au niveau du conteneur.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Sondes : Kubernetes n'envoie du trafic que si /health répond (readiness),
          # et redémarre le conteneur s'il cesse de répondre (liveness).
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          # Quotas : requests = réservation garantie, limits = plafond (FinOps + stabilité).
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        # emptyDir : stockage éphémère, recréé à chaque redémarrage du pod.
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
