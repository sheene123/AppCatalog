apiVersion: v1
kind: Service
metadata:
  name: appcatalog-web
  labels:
    app: appcatalog-web
spec:
  # ClusterIP : le frontend est désormais exposé via l'Ingress HTTPS (ingress-nginx),
  # plus par une IP publique directe.
  type: ClusterIP
  selector:
    app: appcatalog-web
  ports:
    - name: http
      port: 80
      targetPort: http
